[package]
name = "wtagent-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Use your web AI account as a local CLI coding agent, implemented in Rust."
license = "MIT"
repository = "https://github.com/hu-qi/wtagent-rs"
readme = "README.md"
keywords = ["agent", "web-ai", "chatgpt", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wtagent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.15", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.19"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
