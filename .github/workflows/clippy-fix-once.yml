name: Clippy fix once

on:
  push:
    branches:
      - feat/rust-rewrite

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply machine-applicable Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features
      - name: Format
        run: cargo fmt --all
      - name: Verify strict Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy-remaining.log
          code=${PIPESTATUS[0]}
          echo "CLIPPY_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply Clippy suggestions"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-remaining
          path: clippy-remaining.log
