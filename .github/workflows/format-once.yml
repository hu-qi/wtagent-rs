name: Format and lock once

on:
  push:
    branches:
      - feat/rust-rewrite

permissions:
  contents: write

jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate lockfile and format Rust
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit generated lockfile and rustfmt output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock src
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: add lockfile and apply rustfmt"
          git push origin "HEAD:${{ github.ref_name }}"
